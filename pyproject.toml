[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coffee-vending-demand"
version = "0.1.0"
description = "Demand forecasting and replenishment policy for coffee vending operations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luiz Gustavo Bravo", email = "luizgustavobravo@gmail.com" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "lightgbm>=4.3",
    "holidays>=0.45",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml",
]
docs = [
    "markdown>=3.6",
    "pygments>=2.17",
]

[project.scripts]
coffee-intel = "coffee_intel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/coffee_intel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PD", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=coffee_intel --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
packages = ["coffee_intel"]
exclude = ["tests/"]

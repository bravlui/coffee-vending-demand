# ---------------------------------------------------------------------------
# Central configuration for the coffee-intel pipeline.
# Every stage reads from here so that a run is fully reproducible from config.
# ---------------------------------------------------------------------------

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  figures_dir: reports/figures
  metrics_dir: reports/metrics

data:
  # Primary transactional file (has the anonymised card id).
  primary_file: index_1.csv
  # Secondary file is a different machine with no card id and a short history.
  # Kept off by default; only used for the fleet-scale narrative.
  secondary_file: index_2.csv
  use_secondary: false
  timezone: Europe/Kiev
  currency: UAH
  strict_validation: true

cleaning:
  # Drop rows whose unit price is outside this absolute sanity range.
  min_price: 5.0
  max_price: 100.0
  # Collapse case / whitespace variants of the product name.
  normalise_product_names: true

forecasting:
  target: units            # units | revenue
  horizon_days: 7          # weekly replenishment cycle
  lags: [7, 14, 28]        # all >= horizon so they are known at prediction time
  rolling_windows: [7, 28]
  backtest:
    n_folds: 8
    step_days: 7
    min_train_days: 180
  # The model predicts units / level (an adaptive EWMA of recent demand), so the
  # trend comes from recent data and the tree only learns the seasonal shape.
  target_transform: ratio_to_level   # ratio_to_level | none
  model_selection:
    # Parsimony rule: only adopt a more complex model if it beats the simple
    # reference by more than this margin on cycle-level WAPE. Complexity has an
    # operational cost that a marginal accuracy gain does not pay for.
    reference_model: seasonal_naive
    parsimony_tolerance: 0.02
    min_fold_win_rate: 0.50
    max_abs_bias_increase: 0.25
    holdout_max_regression: 0.02
  lightgbm:
    objective: regression_l2
    tweedie_variance_power: 1.2   # only used when objective == tweedie
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 30
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    random_state: 42
  tuning:
    enabled: true
    # Oldest folds select hyperparameters; the latest folds remain untouched.
    holdout_folds: 2
    max_candidates: 12
    objectives: [regression_l2, poisson, tweedie]
    num_leaves: [7, 15, 31]
    learning_rates: [0.02, 0.05]
    min_child_samples: [20, 50]

replenishment:
  service_level: 0.95       # target in-stock probability over the cycle
  lead_time_days: 1         # time between order and refill
  safety_stock_method: normal  # empirical remains evaluated in the policy backtest

segmentation:
  # Recency reference date is the last transaction date in the data by default.
  snapshot_date: null
  min_transactions: 1
  features: [recency_days, frequency, monetary, tenure_days, avg_ticket]
  kmeans:
    k_candidates: [3, 4, 5, 6]
    random_state: 42
    n_init: 10

random_seed: 42
